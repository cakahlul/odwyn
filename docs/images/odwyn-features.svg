<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc"><title id="title">A small team, a useful set of tools</title><desc id="desc">Odwyn combines customizable agents, browser takeover, collaborative rooms, reusable skills and knowledge, workflows and routines, and an audit log.</desc><rect width="1440" height="700" rx="28" fill="#f4f1ea"/><g font-family="Arial, Helvetica, sans-serif" fill="#292b28"><text x="56" y="74" font-size="36" font-weight="700">A small team. A useful set of tools.</text>
<rect x="56" y="115" width="428" height="244" rx="18" fill="#fffefa" stroke="#d7d1c6"/><text x="82" y="161" font-size="18" font-weight="700" fill="#c55335">01</text><text x="82" y="215" font-size="25" font-weight="700">Agents with a point of view</text><text x="82" y="265" font-size="20" fill="#66665e"><tspan x="82">Name them. Shape their role.</tspan><tspan x="82" dy="31">Choose a provider for each agent.</tspan></text>
<rect x="508" y="115" width="428" height="244" rx="18" fill="#fffefa" stroke="#d7d1c6"/><text x="534" y="161" font-size="18" font-weight="700" fill="#c55335">02</text><text x="534" y="215" font-size="25" font-weight="700">A browser you can take over</text><text x="534" y="265" font-size="20" fill="#66665e"><tspan x="534">Let agents browse, then step in</tspan><tspan x="534" dy="31">when a website needs you.</tspan></text>
<rect x="960" y="115" width="428" height="244" rx="18" fill="#fffefa" stroke="#d7d1c6"/><text x="986" y="161" font-size="18" font-weight="700" fill="#c55335">03</text><text x="986" y="215" font-size="25" font-weight="700">Rooms for shared work</text><text x="986" y="265" font-size="20" fill="#66665e"><tspan x="986">Bring agents into one conversation.</tspan><tspan x="986" dy="31">Compare ideas and review results.</tspan></text>
<rect x="56" y="385" width="428" height="244" rx="18" fill="#fffefa" stroke="#d7d1c6"/><text x="82" y="431" font-size="18" font-weight="700" fill="#c55335">04</text><text x="82" y="485" font-size="25" font-weight="700">Skills + knowledge</text><text x="82" y="535" font-size="20" fill="#66665e"><tspan x="82">Reuse instructions and references.</tspan><tspan x="82" dy="31">Assign them to future agent tasks.</tspan></text>
<rect x="508" y="385" width="428" height="244" rx="18" fill="#fffefa" stroke="#d7d1c6"/><text x="534" y="431" font-size="18" font-weight="700" fill="#c55335">05</text><text x="534" y="485" font-size="25" font-weight="700">Workflows + routines</text><text x="534" y="535" font-size="20" fill="#66665e"><tspan x="534">Save a repeatable process.</tspan><tspan x="534" dy="31">Run it now or schedule the next one.</tspan></text>
<rect x="960" y="385" width="428" height="244" rx="18" fill="#fffefa" stroke="#d7d1c6"/><text x="986" y="431" font-size="18" font-weight="700" fill="#c55335">06</text><text x="986" y="485" font-size="25" font-weight="700">Activity you can inspect</text><text x="986" y="535" font-size="20" fill="#66665e"><tspan x="986">Review task events, time and tokens.</tspan><tspan x="986" dy="31">See charges or labelled estimates.</tspan></text>
</g></svg>