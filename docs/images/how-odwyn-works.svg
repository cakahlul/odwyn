<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title description">
<title id="title">How Odwyn works</title>
<desc id="description">Give Odwyn a goal. Agents research or discuss it using the resources you grant. Review a recommendation, draft, or file, and approve actions when required.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#dd6545"/></marker></defs>
<rect width="1440" height="780" rx="24" fill="#f4f2eb"/>
<g transform="translate(64 48) scale(1.1)"><style>.mark-body,.mark-edge{fill:#f26945}.mark-face{fill:#fffefa}.mark-features{stroke:#292b28}</style><defs><linearGradient id="odwyn-icon-edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient><radialGradient id="odwyn-icon-light" cx="24%" cy="12%" r="92%"><stop stop-color="#fff" stop-opacity=".65"/><stop offset=".48" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></radialGradient><linearGradient id="odwyn-icon-ceramic" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff" stop-opacity=".8"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient></defs><ellipse cx="34" cy="58" rx="21" ry="3" fill="#292b28" opacity=".12"/><rect class="mark-edge" x="10" y="9" width="47" height="48" rx="17"/><rect x="10" y="9" width="47" height="48" rx="17" fill="url(#odwyn-icon-edge)"/><rect class="mark-body" x="6" y="4" width="47" height="48" rx="17"/><rect x="6" y="4" width="47" height="48" rx="17" fill="url(#odwyn-icon-light)"/><path d="M12 24c0-9 5-15 15-16" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round"/><path d="M20 20c4-4 14-5 19-1 4 4 4 17 0 23-4 5-14 6-19 1-4-4-4-18 0-23Z" fill="#292b28" opacity=".16" transform="translate(1 2)"/><path class="mark-face" d="M20 18c4-4 14-5 19-1 4 4 4 17 0 23-4 5-14 6-19 1-4-4-4-18 0-23Z"/><path d="M20 18c4-4 14-5 19-1 4 4 4 17 0 23-4 5-14 6-19 1-4-4-4-18 0-23Z" fill="url(#odwyn-icon-ceramic)"/><g class="mark-features" fill="none" stroke-linecap="round"><path d="m24 24 .6 6m10-8 .6 6" stroke-width="3.5"/><path d="M24 36q6 5 12-2" stroke-width="2.5"/></g></g>
<g font-family="Arial, Helvetica, sans-serif" fill="#292f29">
<text x="150" y="89" font-size="36" font-weight="700">Odwyn, at work</text>
<text x="150" y="123" font-size="22" fill="#5a665b">From a question to a result you can use.</text>

<rect x="64" y="182" width="400" height="416" rx="18" fill="#fffefa" stroke="#d5ddd1" stroke-width="2"/>
<rect x="520" y="182" width="400" height="416" rx="18" fill="#fffefa" stroke="#d5ddd1" stroke-width="2"/>
<rect x="976" y="182" width="400" height="416" rx="18" fill="#fffefa" stroke="#d5ddd1" stroke-width="2"/>
<path d="M478 390 H505" stroke="#dd6545" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M934 390 H961" stroke="#dd6545" stroke-width="3" marker-end="url(#arrow)"/>

<circle cx="105" cy="226" r="18" fill="#fbe7de"/><text x="105" y="233" text-anchor="middle" font-size="20" fill="#aa432b" font-weight="700">1</text>
<text x="137" y="234" font-size="27" font-weight="700">Give it a goal</text>
<rect x="92" y="282" width="344" height="189" rx="12" fill="#e8eee2"/>
<text x="115" y="326" font-size="28" font-weight="600"><tspan x="115">Find a quiet hotel</tspan><tspan x="115" dy="42">near Shinjuku for</tspan><tspan x="115" dy="42">under $150/night.</tspan></text>
<text x="92" y="517" font-size="22" fill="#5a665b"><tspan x="92">Choose an agent, or a room</tspan><tspan x="92" dy="32">for a shared discussion.</tspan></text>

<circle cx="561" cy="226" r="18" fill="#fbe7de"/><text x="561" y="233" text-anchor="middle" font-size="20" fill="#aa432b" font-weight="700">2</text>
<text x="593" y="234" font-size="27" font-weight="700">Let your agents work</text>
<rect x="548" y="282" width="344" height="74" rx="12" fill="#f5f3ed"/>
<circle cx="581" cy="319" r="17" fill="#fbe7de"/><path d="M574 319l5 5 9-12" fill="none" stroke="#aa432b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="609" y="327" font-size="23" font-weight="600">Research and compare</text>
<rect x="548" y="370" width="344" height="74" rx="12" fill="#f5f3ed"/>
<circle cx="581" cy="407" r="17" fill="#e3ecdb"/><path d="M572 402h18v11h-11l-5 4v-4h-2z" fill="none" stroke="#4d6544" stroke-width="2" stroke-linejoin="round"/>
<text x="609" y="415" font-size="23" font-weight="600">Discuss the options</text>
<text x="548" y="501" font-size="22" fill="#5a665b"><tspan x="548">Work within granted access:</tspan><tspan x="548" dy="34">browsing, workspace, memory.</tspan></text>

<circle cx="1017" cy="226" r="18" fill="#fbe7de"/><text x="1017" y="233" text-anchor="middle" font-size="20" fill="#aa432b" font-weight="700">3</text>
<text x="1049" y="234" font-size="27" font-weight="700">Review the result</text>
<rect x="1004" y="282" width="344" height="189" rx="12" fill="#e8eee2"/>
<text x="1026" y="327" font-size="25" font-weight="700">A shortlist with reasons</text>
<path d="M1027 354h282M1027 376h236M1027 398h258" stroke="#b7c6af" stroke-width="7" stroke-linecap="round"/>
<text x="1026" y="441" font-size="21" fill="#4d6544">Sources, tradeoffs, next steps.</text>
<text x="1004" y="517" font-size="22" fill="#5a665b"><tspan x="1004">Keep the conversation going</tspan><tspan x="1004" dy="32">or schedule the next check.</tspan></text>

<rect x="64" y="644" width="1312" height="78" rx="14" fill="#e3e9dc"/>
<rect x="94" y="670" width="22" height="21" rx="4" fill="none" stroke="#4d6544" stroke-width="2.5"/><path d="M99 670v-5a6 6 0 0112 0v5" fill="none" stroke="#4d6544" stroke-width="2.5"/>
<text x="135" y="692" font-size="25" font-weight="600">You control resource access and approve actions when required.</text>
</g>
</svg>
