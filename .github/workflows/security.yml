name: Security contract
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lightweight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun test tests/security/phase2/fail-closed.test.js
      - run: bun test test/core.test.js test/runtime.test.js test/terminal.test.js test/files.test.js test/workflows.test.js
      - name: Phase 3 lightweight fixtures (full OS/browser gate runs on disposable runner)
        run: |
          mkdir -p artifacts/security/pr/proof
          ODWYN_SECURITY_REPORT_DIR="$PWD/artifacts/security/pr" bun test tests/security/phase3 --test-name-pattern 'DATA-00[256789]|DATA-010|DATA-003 Credential redaction$|DATA-003 Credential redaction: provider settings|DATA-003 Credential redaction: legacy key migration|DATA-003 Credential redaction: raw credentials' --reporter=junit --reporter-outfile=artifacts/security/pr/phase3-lightweight.junit.xml
      - name: Phase 4 lightweight approvals (not a cumulative gate)
        run: |
          mkdir -p artifacts/security/pr/proof
          python3 scripts/verify-security-catalog.py --phase 4
          ODWYN_SECURITY_REPORT_DIR="$PWD/artifacts/security/pr" bun test tests/security/phase4 --test-name-pattern 'APPR-00[1-6] [^:]*$|AUD-001|privileged policy expansion|provider completion|identical retry|consumed approvals remain|low-risk Ask|changed upstream target|held real action' --reporter=junit --reporter-outfile=artifacts/security/pr/phase4-lightweight.junit.xml
      - name: Phase 5 lightweight migration and recovery (not a cumulative gate)
        run: |
          mkdir -p artifacts/security/pr/proof
          python3 scripts/verify-security-catalog.py --phase 5
          for name in 'MIG-001 Legacy settings fail closed' 'MIG-002 Migration interruption and rollback' 'REC-001 Restart + retry double-execution' 'OPS-001 Disable integration emergency' 'OPS-002 Production-mode fail closed'; do
            id="${name%% *}"
            ODWYN_SECURITY_REPORT_DIR="$PWD/artifacts/security/pr" ODWYN_SECURITY_CASE="$name" bun test ./tests/security/phase5/cases.js --reporter=junit --reporter-outfile="artifacts/security/pr/$id.junit.xml"
          done
      - name: Phase 0 characterization only (not release approval)
        run: |
          python3 scripts/verify-security-catalog.py --phase 0
          mkdir -p artifacts/security/pr/proof
          ODWYN_SECURITY_REPORT_DIR="$PWD/artifacts/security/pr" bun test tests/security/phase0 --test-name-pattern 'BASE-00[12]|Phase 0 task identity' --reporter=junit --reporter-outfile=artifacts/security/pr/lightweight.junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-lightweight
          path: artifacts/security/
  release-hard-gate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    # Provision a fresh disposable runner with Bun, Codex, Chromium and the real
    # isolated backend. This label is an operator declaration, not isolation proof.
    runs-on: [self-hosted, odwyn-disposable-security]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Build reviewed immutable non-root worker
        run: |
          docker build --pull=false -t odwyn-security-worker:ci execution
          docker image inspect odwyn-security-worker:ci --format 'ODWYN_SECURITY_SANDBOX_IMAGE={{.Id}}' >> "$GITHUB_ENV"
          docker build --pull=false -f execution/Dockerfile.browser -t odwyn-security-browser:ci .
          docker image inspect odwyn-security-browser:ci --format 'ODWYN_SECURITY_BROWSER_IMAGE={{.Id}}' >> "$GITHUB_ENV"
      - run: ODWYN_SECURITY_ISOLATION_RUNNER=1 bash scripts/security-gate.sh --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-release-evidence
          path: artifacts/security/
